<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Menulis Nama Anda dalam Aksara Bali">
  <defs>
    <linearGradient id="bgNama" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1020"/>
      <stop offset="1" stop-color="#060711"/>
    </linearGradient>
    <linearGradient id="indigoNama" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9db4ff"/>
      <stop offset="1" stop-color="#4257c4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bgNama)"/>

  <!-- One name, two readings. The same syllable with the mark in front and the
       mark above — taling or pepet, the coin flip the post is about. -->
  <g transform="translate(170 210)">
    <g>
      <path d="M0 -34 C 44 -34, 66 0, 44 32 C 28 56, -6 56, -22 32"
            fill="none" stroke="url(#indigoNama)" stroke-width="12" stroke-linecap="round"/>
      <path d="M-62 -30 C -88 -30, -94 34, -62 34" fill="none" stroke="#9db4ff"
            stroke-width="10" stroke-linecap="round"/>
    </g>

    <path d="M136 0 H196" stroke="#9db4ff" stroke-width="6" stroke-dasharray="10 12"
          stroke-linecap="round" opacity="0.45"/>

    <g transform="translate(300 0)">
      <path d="M0 -34 C 44 -34, 66 0, 44 32 C 28 56, -6 56, -22 32"
            fill="none" stroke="url(#indigoNama)" stroke-width="12" stroke-linecap="round"/>
      <circle cx="18" cy="-72" r="13" fill="#9db4ff"/>
    </g>

    <!-- the cursor, because this starts as typing -->
    <rect x="440" y="-46" width="9" height="92" rx="4" fill="#9db4ff" opacity="0.8"/>
    <path d="M478 46 H660" stroke="#9db4ff" stroke-width="7" stroke-linecap="round" opacity="0.25"/>
  </g>

  <text x="120" y="500" fill="#eef1ff"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="76" font-weight="800" letter-spacing="-2">Menulis Nama Anda</text>
  <text x="120" y="584" fill="#eef1ff"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="76" font-weight="800" letter-spacing="-2">dalam Aksara Bali</text>

  <text x="122" y="664" fill="#9db4ff"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="42" font-weight="700" letter-spacing="-1">Periksa huruf e sebelum menatokannya.</text>
</svg>
