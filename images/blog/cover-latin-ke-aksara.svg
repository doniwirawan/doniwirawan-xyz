<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Cara Translate Latin ke Aksara Bali">
  <defs>
    <linearGradient id="bgLatin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171008"/>
      <stop offset="1" stop-color="#0a0705"/>
    </linearGradient>
    <linearGradient id="goldLatin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c46a"/>
      <stop offset="1" stop-color="#c1811f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bgLatin)"/>

  <!-- Three syllables, each a base letter carrying its inherent vowel. The marks
       are where the vowels actually go: above, below, and in front — which is the
       part of the script a Latin keyboard has no way to suggest. -->
  <g transform="translate(120 200)">
    <rect x="0" y="0" width="96" height="96" rx="20" fill="url(#goldLatin)" opacity="0.9"/>
    <circle cx="48" cy="-34" r="12" fill="#f2c46a"/>

    <rect x="150" y="0" width="96" height="96" rx="20" fill="url(#goldLatin)" opacity="0.9"/>
    <path d="M182 130 C 182 158, 206 168, 226 158" fill="none" stroke="#f2c46a"
          stroke-width="10" stroke-linecap="round"/>

    <rect x="300" y="0" width="96" height="96" rx="20" fill="url(#goldLatin)" opacity="0.9"/>
    <path d="M278 20 C 258 20, 252 76, 278 76" fill="none" stroke="#f2c46a"
          stroke-width="10" stroke-linecap="round"/>
    <circle cx="348" cy="-34" r="12" fill="#f2c46a" opacity="0.45"/>

    <rect x="470" y="34" width="240" height="28" rx="8" fill="url(#goldLatin)" opacity="0.2"/>
    <rect x="470" y="34" width="112" height="28" rx="8" fill="url(#goldLatin)" opacity="0.7"/>
  </g>

  <text x="120" y="446" fill="#fbf3e6"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="76" font-weight="800" letter-spacing="-2">Cara Translate Latin</text>
  <text x="120" y="530" fill="#fbf3e6"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="76" font-weight="800" letter-spacing="-2">ke Aksara Bali</text>

  <text x="122" y="610" fill="#f2c46a"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="42" font-weight="700" letter-spacing="-1">Langkahnya, dan yang sering meleset.</text>
</svg>
