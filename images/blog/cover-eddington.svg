<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Eddington Number: Angka yang Lebih Jujur daripada Total Jarak">
  <defs>
    <linearGradient id="bgEdd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161207"/>
      <stop offset="1" stop-color="#0a0804"/>
    </linearGradient>
    <linearGradient id="bronzeEdd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5cf7a"/>
      <stop offset="1" stop-color="#a8721a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bgEdd)"/>

  <!-- Rides sorted longest to shortest, against the diagonal they have to stay
       above. Where the bars cross the line is E — and every bar past it is a
       ride that no longer counts. -->
  <g transform="translate(150 320)">
    <g>
      <rect x="0"   y="-210" width="34" height="210" rx="6" fill="url(#bronzeEdd)" opacity="0.9"/>
      <rect x="46"  y="-192" width="34" height="192" rx="6" fill="url(#bronzeEdd)" opacity="0.9"/>
      <rect x="92"  y="-176" width="34" height="176" rx="6" fill="url(#bronzeEdd)" opacity="0.9"/>
      <rect x="138" y="-154" width="34" height="154" rx="6" fill="url(#bronzeEdd)" opacity="0.9"/>
      <rect x="184" y="-140" width="34" height="140" rx="6" fill="url(#bronzeEdd)" opacity="0.9"/>
      <rect x="230" y="-118" width="34" height="118" rx="6" fill="url(#bronzeEdd)" opacity="0.55"/>
      <rect x="276" y="-96"  width="34" height="96"  rx="6" fill="url(#bronzeEdd)" opacity="0.28"/>
      <rect x="322" y="-78"  width="34" height="78"  rx="6" fill="url(#bronzeEdd)" opacity="0.22"/>
      <rect x="368" y="-58"  width="34" height="58"  rx="6" fill="url(#bronzeEdd)" opacity="0.18"/>
      <rect x="414" y="-40"  width="34" height="40"  rx="6" fill="url(#bronzeEdd)" opacity="0.14"/>
    </g>

    <path d="M-16 -8 L 470 -238" stroke="#f5cf7a" stroke-width="5" stroke-dasharray="14 12"
          stroke-linecap="round" opacity="0.55"/>
    <circle cx="247" cy="-132" r="15" fill="none" stroke="#f5cf7a" stroke-width="7"/>
  </g>

  <text x="120" y="500" fill="#fbf4e2"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="76" font-weight="800" letter-spacing="-2">Eddington Number</text>
  <text x="120" y="584" fill="#fbf4e2"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="76" font-weight="800" letter-spacing="-2">Bersepeda</text>

  <text x="122" y="664" fill="#f5cf7a"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="42" font-weight="700" letter-spacing="-1">Lebih jujur daripada total jarak.</text>
</svg>
