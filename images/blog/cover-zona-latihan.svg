<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Zona Latihan Bersepeda: Heart Rate, Power, dan FTP">
  <defs>
    <linearGradient id="bgZona" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0c08"/>
      <stop offset="1" stop-color="#0b0504"/>
    </linearGradient>
    <linearGradient id="fireZona" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff7a5c"/>
      <stop offset="1" stop-color="#c0301a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bgZona)"/>

  <!-- Seven zones as a rising stack, and the line at FTP that every one of them
       is measured against. The tallest bar is where most people actually live. -->
  <g transform="translate(150 300)">
    <rect x="0"   y="-46"  width="66" height="46"  rx="8" fill="url(#fireZona)" opacity="0.28"/>
    <rect x="82"  y="-92"  width="66" height="92"  rx="8" fill="url(#fireZona)" opacity="0.42"/>
    <rect x="164" y="-158" width="66" height="158" rx="8" fill="url(#fireZona)" opacity="0.95"/>
    <rect x="246" y="-116" width="66" height="116" rx="8" fill="url(#fireZona)" opacity="0.55"/>
    <rect x="328" y="-74"  width="66" height="74"  rx="8" fill="url(#fireZona)" opacity="0.42"/>
    <rect x="410" y="-52"  width="66" height="52"  rx="8" fill="url(#fireZona)" opacity="0.3"/>
    <rect x="492" y="-32"  width="66" height="32"  rx="8" fill="url(#fireZona)" opacity="0.22"/>

    <path d="M-20 -128 H 596" stroke="#ff7a5c" stroke-width="5" stroke-dasharray="16 12"
          stroke-linecap="round" opacity="0.75"/>
    <text x="612" y="-118" fill="#ff7a5c"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
          font-size="34" font-weight="800" letter-spacing="1">FTP</text>
  </g>

  <text x="120" y="500" fill="#fdeeea"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="76" font-weight="800" letter-spacing="-2">Zona Latihan</text>
  <text x="120" y="584" fill="#fdeeea"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="76" font-weight="800" letter-spacing="-2">Bersepeda</text>

  <text x="122" y="664" fill="#ff7a5c"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="42" font-weight="700" letter-spacing="-1">Heart rate, power, dan FTP.</text>
</svg>
