<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Nyeri Lutut Saat Bersepeda">
  <defs>
    <linearGradient id="bgLutut" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12150a"/>
      <stop offset="1" stop-color="#080a05"/>
    </linearGradient>
    <linearGradient id="limeLutut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbe86a"/>
      <stop offset="1" stop-color="#7ba62a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bgLutut)"/>

  <!-- The joint, and the two directions the post is built around: pain in front
       points one way, pain behind points the other. -->
  <g transform="translate(300 230)">
    <path d="M-140 -108 L0 0" fill="none" stroke="url(#limeLutut)" stroke-width="14" stroke-linecap="round" opacity="0.55"/>
    <path d="M0 0 L-52 122" fill="none" stroke="url(#limeLutut)" stroke-width="14" stroke-linecap="round" opacity="0.55"/>
    <circle cx="0" cy="0" r="44" fill="none" stroke="#cbe86a" stroke-width="9"/>
    <circle cx="0" cy="0" r="72" fill="none" stroke="#cbe86a" stroke-width="5" opacity="0.35"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#cbe86a" stroke-width="4" opacity="0.16"/>

    <path d="M96 -32 H190 M166 -54 L190 -32 L166 -10" fill="none" stroke="#cbe86a"
          stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <path d="M-96 46 H-190 M-166 24 L-190 46 L-166 68" fill="none" stroke="#cbe86a"
          stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  </g>

  <text x="120" y="500" fill="#f5fae4"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="76" font-weight="800" letter-spacing="-2">Nyeri Lutut</text>
  <text x="120" y="584" fill="#f5fae4"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="76" font-weight="800" letter-spacing="-2">Saat Bersepeda</text>

  <text x="122" y="664" fill="#cbe86a"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="42" font-weight="700" letter-spacing="-1">Letak nyerinya menunjukkan arahnya.</text>
</svg>
