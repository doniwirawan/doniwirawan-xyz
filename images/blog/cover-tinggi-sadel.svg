<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Tinggi Sadel Sepeda yang Benar">
  <defs>
    <linearGradient id="bgSadel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091418"/>
      <stop offset="1" stop-color="#05090b"/>
    </linearGradient>
    <linearGradient id="iceSadel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fe6ff"/>
      <stop offset="1" stop-color="#1f8fb8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bgSadel)"/>

  <!-- A seatpost with a scale beside it. The band is the window that is right;
       everything above and below is the guessing this post is trying to end. -->
  <g transform="translate(150 120)">
    <rect x="34" y="0" width="30" height="300" rx="15" fill="url(#iceSadel)" opacity="0.28"/>
    <rect x="34" y="96" width="30" height="72" rx="15" fill="url(#iceSadel)"/>
    <path d="M0 20 H22 M0 60 H22 M0 100 H22 M0 140 H22 M0 180 H22 M0 220 H22 M0 260 H22"
          stroke="#7fe6ff" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
    <path d="M92 132 H150" stroke="#7fe6ff" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
    <path d="M110 -14 C 150 -14, 186 4, 196 24 L 96 24 C 96 4, 96 -6, 110 -14 Z"
          fill="url(#iceSadel)" opacity="0.9" transform="translate(-62 -30)"/>
  </g>

  <!-- The angle it is all really about -->
  <g transform="translate(470 210)" opacity="0.9">
    <path d="M0 0 L128 108" fill="none" stroke="url(#iceSadel)" stroke-width="12" stroke-linecap="round"/>
    <path d="M128 108 L82 214" fill="none" stroke="url(#iceSadel)" stroke-width="12" stroke-linecap="round"/>
    <path d="M128 108 m -40 -34 a 53 53 0 0 0 -21 84" fill="none" stroke="#7fe6ff"
          stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <circle cx="128" cy="108" r="13" fill="#091418" stroke="#7fe6ff" stroke-width="7"/>
  </g>

  <text x="120" y="500" fill="#eaf9ff"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="76" font-weight="800" letter-spacing="-2">Tinggi Sadel Sepeda</text>
  <text x="120" y="584" fill="#eaf9ff"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="76" font-weight="800" letter-spacing="-2">yang Benar</text>

  <text x="122" y="664" fill="#7fe6ff"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="42" font-weight="700" letter-spacing="-1">Cara mengukur, dan tanda kalau salah.</text>
</svg>
