<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Pantat Sakit Saat Bersepeda">
  <defs>
    <linearGradient id="bgSadelSakit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0e0a"/>
      <stop offset="1" stop-color="#0b0605"/>
    </linearGradient>
    <linearGradient id="emberSakit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9d7e"/>
      <stop offset="1" stop-color="#cf4a2e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bgSadelSakit)"/>

  <!-- A saddle from above, and the two sit bones that are supposed to carry the
       load. The width between them is the measurement the post is built on. -->
  <g transform="translate(240 240)">
    <path d="M0 -150 C 34 -150, 46 -96, 44 -40 C 42 10, 96 26, 96 74 C 96 116, 58 140, 20 140
             C 4 140, -4 140, -20 140 C -58 140, -96 116, -96 74 C -96 26, -42 10, -44 -40
             C -46 -96, -34 -150, 0 -150 Z"
          fill="none" stroke="url(#emberSakit)" stroke-width="10" stroke-linejoin="round" opacity="0.85"/>
    <circle cx="-46" cy="66" r="21" fill="#ff9d7e"/>
    <circle cx="46" cy="66" r="21" fill="#ff9d7e"/>
    <path d="M-46 118 H46 M-32 104 L-46 118 L-32 132 M32 104 L46 118 L32 132"
          fill="none" stroke="#ff9d7e" stroke-width="6" stroke-linecap="round"
          stroke-linejoin="round" opacity="0.7"/>
  </g>

  <!-- what most people buy instead: more foam -->
  <g transform="translate(560 240)" opacity="0.4">
    <rect x="0" y="-40" width="300" height="80" rx="40" fill="url(#emberSakit)"/>
    <path d="M40 -70 L260 70 M260 -70 L40 70" stroke="#1a0e0a" stroke-width="14" stroke-linecap="round"/>
  </g>

  <text x="120" y="500" fill="#fdeee9"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="76" font-weight="800" letter-spacing="-2">Pantat Sakit</text>
  <text x="120" y="584" fill="#fdeee9"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="76" font-weight="800" letter-spacing="-2">Saat Bersepeda</text>

  <text x="122" y="664" fill="#ff9d7e"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="42" font-weight="700" letter-spacing="-1">Sadel empuk bukan jawabannya.</text>
</svg>
