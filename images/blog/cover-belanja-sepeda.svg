<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Barang yang perlu dibeli setelah punya sepeda">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1510"/><stop offset="1" stop-color="#050a07"/></linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7ee0a1"/><stop offset="1" stop-color="#2f9e5b"/></linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <g transform="translate(120 140)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif">
    <text x="0" y="26" fill="#7ee0a1" font-size="24" font-weight="700" opacity="0.9">1</text>
    <rect x="40" y="6" width="520" height="26" rx="13" fill="url(#g)"/>
    <text x="580" y="28" fill="#f4f2fa" font-size="22" font-weight="600" opacity="0.8">Aman &amp; nyaman</text>
    <text x="0" y="78" fill="#7ee0a1" font-size="24" font-weight="700" opacity="0.7">2</text>
    <rect x="40" y="58" width="300" height="26" rx="13" fill="url(#g)" opacity="0.6"/>
    <text x="360" y="80" fill="#f4f2fa" font-size="22" font-weight="600" opacity="0.6">Perawatan</text>
    <text x="0" y="130" fill="#7ee0a1" font-size="24" font-weight="700" opacity="0.5">3</text>
    <rect x="40" y="110" width="200" height="26" rx="13" fill="url(#g)" opacity="0.4"/>
    <text x="260" y="132" fill="#f4f2fa" font-size="22" font-weight="600" opacity="0.45">Alat</text>
    <text x="0" y="182" fill="#7ee0a1" font-size="24" font-weight="700" opacity="0.35">4</text>
    <rect x="40" y="162" width="110" height="26" rx="13" fill="url(#g)" opacity="0.25"/>
    <text x="170" y="184" fill="#f4f2fa" font-size="22" font-weight="600" opacity="0.35">Upgrade, nanti saja</text>
  </g>
  <text x="120" y="500" fill="#f4f2fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="76" font-weight="800" letter-spacing="-2">Sudah punya sepeda,</text>
  <text x="120" y="584" fill="#f4f2fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="76" font-weight="800" letter-spacing="-2">lalu beli apa lagi?</text>
  <text x="122" y="664" fill="#7ee0a1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="42" font-weight="700" letter-spacing="-1">Harga asli dari ~190 barang.</text>
</svg>
