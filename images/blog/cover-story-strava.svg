<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Cara Membuat Story Strava yang Tidak Membosankan">
  <defs>
    <linearGradient id="bgStory" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#170c18"/>
      <stop offset="1" stop-color="#0a050a"/>
    </linearGradient>
    <linearGradient id="pinkStory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8ad4"/>
      <stop offset="1" stop-color="#c2338f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bgStory)"/>

  <!-- Three 9:16 cards: the plain one, the one with the route, and the one with
       nothing behind it at all — which is the option the post is really about. -->
  <g transform="translate(150 120)">
    <g opacity="0.4">
      <rect x="0" y="20" width="152" height="270" rx="18" fill="none" stroke="url(#pinkStory)" stroke-width="6"/>
      <rect x="22" y="216" width="90" height="12" rx="6" fill="#ff8ad4"/>
      <rect x="22" y="240" width="60" height="10" rx="5" fill="#ff8ad4" opacity="0.6"/>
    </g>

    <g opacity="0.75" transform="translate(186 0)">
      <rect x="0" y="20" width="152" height="270" rx="18" fill="none" stroke="url(#pinkStory)" stroke-width="6"/>
      <path d="M28 150 C 58 110, 44 88, 76 78 C 112 68, 128 106, 108 132 C 88 158, 44 152, 40 184
               C 36 210, 74 216, 108 200"
            fill="none" stroke="#ff8ad4" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
      <rect x="22" y="228" width="96" height="12" rx="6" fill="#ff8ad4"/>
      <rect x="22" y="252" width="56" height="10" rx="5" fill="#ff8ad4" opacity="0.6"/>
    </g>

    <!-- the transparent one: checkerboard behind, nothing else -->
    <g transform="translate(372 0)">
      <rect x="0" y="20" width="152" height="270" rx="18" fill="none" stroke="#ff8ad4" stroke-width="6"/>
      <g opacity="0.16">
        <rect x="10" y="30" width="34" height="34" fill="#ff8ad4"/>
        <rect x="78" y="30" width="34" height="34" fill="#ff8ad4"/>
        <rect x="44" y="64" width="34" height="34" fill="#ff8ad4"/>
        <rect x="112" y="64" width="30" height="34" fill="#ff8ad4"/>
        <rect x="10" y="98" width="34" height="34" fill="#ff8ad4"/>
        <rect x="78" y="98" width="34" height="34" fill="#ff8ad4"/>
      </g>
      <rect x="22" y="214" width="108" height="14" rx="7" fill="#ff8ad4"/>
      <rect x="22" y="240" width="64" height="11" rx="5" fill="#ff8ad4" opacity="0.7"/>
    </g>

    <text x="560" y="160" fill="#ff8ad4"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
          font-size="38" font-weight="800" letter-spacing="1">1080 × 1920</text>
  </g>

  <text x="120" y="500" fill="#fdeaf7"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="76" font-weight="800" letter-spacing="-2">Cara Membuat</text>
  <text x="120" y="584" fill="#fdeaf7"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="76" font-weight="800" letter-spacing="-2">Story Strava</text>

  <text x="122" y="664" fill="#ff8ad4"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="42" font-weight="700" letter-spacing="-1">Latar transparan, di atas foto Anda.</text>
</svg>
