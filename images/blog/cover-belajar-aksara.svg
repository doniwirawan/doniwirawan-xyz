<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Belajar Aksara Bali dari Nol">
  <defs>
    <linearGradient id="bgBelajar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16130c"/>
      <stop offset="1" stop-color="#0a0806"/>
    </linearGradient>
    <linearGradient id="sandBelajar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8dcc0"/>
      <stop offset="1" stop-color="#a08a55"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bgBelajar)"/>

  <!-- The order the post argues for: the vowel marks first, on their own, before
       any consonant. Above, below, in front, and in front and behind at once. -->
  <g transform="translate(160 220)">
    <g>
      <rect x="0" y="0" width="86" height="86" rx="16" fill="url(#sandBelajar)" opacity="0.22"/>
      <circle cx="43" cy="-38" r="13" fill="#e8dcc0"/>
    </g>
    <g transform="translate(132 0)">
      <rect x="0" y="0" width="86" height="86" rx="16" fill="url(#sandBelajar)" opacity="0.22"/>
      <path d="M28 118 C 28 146, 54 156, 74 144" fill="none" stroke="#e8dcc0"
            stroke-width="10" stroke-linecap="round"/>
    </g>
    <g transform="translate(300 0)">
      <rect x="0" y="0" width="86" height="86" rx="16" fill="url(#sandBelajar)" opacity="0.22"/>
      <path d="M-24 16 C -50 16, -56 70, -24 70" fill="none" stroke="#e8dcc0"
            stroke-width="10" stroke-linecap="round"/>
    </g>
    <g transform="translate(486 0)">
      <rect x="0" y="0" width="86" height="86" rx="16" fill="url(#sandBelajar)" opacity="0.22"/>
      <path d="M-24 16 C -50 16, -56 70, -24 70" fill="none" stroke="#e8dcc0"
            stroke-width="10" stroke-linecap="round"/>
      <path d="M110 6 V 80" fill="none" stroke="#e8dcc0" stroke-width="10" stroke-linecap="round"/>
    </g>

    <path d="M0 148 H 596" stroke="#e8dcc0" stroke-width="4" stroke-dasharray="8 14"
          stroke-linecap="round" opacity="0.22"/>
  </g>

  <text x="120" y="500" fill="#f7f2e6"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="76" font-weight="800" letter-spacing="-2">Belajar Aksara Bali</text>
  <text x="120" y="584" fill="#f7f2e6"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="76" font-weight="800" letter-spacing="-2">dari Nol</text>

  <text x="122" y="664" fill="#e8dcc0"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="42" font-weight="700" letter-spacing="-1">Jangan mulai dari tabel aksara.</text>
</svg>
