<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Posisi Cleat Sepeda yang Benar">
  <defs>
    <linearGradient id="bgCleat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1712"/>
      <stop offset="1" stop-color="#050b08"/>
    </linearGradient>
    <linearGradient id="mintCleat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ff0c8"/>
      <stop offset="1" stop-color="#2fa06d"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bgCleat)"/>

  <!-- A sole seen from below, the cleat on it, and the three axes it moves on:
       fore-aft, rotation, and side to side. -->
  <g transform="translate(260 240)">
    <path d="M-58 -168 C 26 -178, 74 -132, 70 -62 C 66 8, 44 62, 46 112
             C 48 158, 12 182, -30 174 C -70 166, -86 130, -80 88
             C -72 30, -78 -30, -74 -86 C -71 -134, -92 -160, -58 -168 Z"
          fill="none" stroke="url(#mintCleat)" stroke-width="9" stroke-linejoin="round" opacity="0.55"/>

    <g transform="rotate(-9)">
      <rect x="-46" y="-88" width="92" height="60" rx="12" fill="url(#mintCleat)" opacity="0.95"/>
      <circle cx="0" cy="-58" r="11" fill="#0a1712"/>
    </g>

    <!-- fore-aft -->
    <path d="M126 -140 V 26 M112 -122 L126 -140 L140 -122 M112 8 L126 26 L140 8"
          fill="none" stroke="#9ff0c8" stroke-width="6" stroke-linecap="round"
          stroke-linejoin="round" opacity="0.8"/>
    <!-- side to side -->
    <path d="M-118 96 H 44 M-100 82 L-118 96 L-100 110 M26 82 L44 96 L26 110"
          fill="none" stroke="#9ff0c8" stroke-width="6" stroke-linecap="round"
          stroke-linejoin="round" opacity="0.5"/>
    <!-- rotation -->
    <path d="M158 -58 a 74 74 0 0 1 -22 106" fill="none" stroke="#9ff0c8"
          stroke-width="6" stroke-linecap="round" opacity="0.65"/>
    <path d="M150 34 L136 48 L122 32" fill="none" stroke="#9ff0c8" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>
  </g>

  <text x="120" y="500" fill="#e9fbf2"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="76" font-weight="800" letter-spacing="-2">Posisi Cleat Sepeda</text>
  <text x="120" y="584" fill="#e9fbf2"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="76" font-weight="800" letter-spacing="-2">yang Benar</text>

  <text x="122" y="664" fill="#9ff0c8"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="42" font-weight="700" letter-spacing="-1">Tiga sumbu, bukan satu.</text>
</svg>
