<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="How a Balinese Script Translator Actually Works">
  <defs>
    <linearGradient id="bgTrans" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1614"/>
      <stop offset="1" stop-color="#050b0a"/>
    </linearGradient>
    <linearGradient id="jadeTrans" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fe3c0"/>
      <stop offset="1" stop-color="#22957a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bgTrans)"/>

  <!-- The conversion, drawn as what it is: one writing system in, another out.
       Left is a flat row of separate Latin letters. Right is a single stacked
       syllable — a base letter with a vowel mark above and one hanging below. -->
  <g transform="translate(120 190)">
    <rect x="0" y="-14" width="46" height="28" rx="8" fill="url(#jadeTrans)" opacity="0.45"/>
    <rect x="60" y="-14" width="46" height="28" rx="8" fill="url(#jadeTrans)" opacity="0.45"/>
    <rect x="120" y="-14" width="46" height="28" rx="8" fill="url(#jadeTrans)" opacity="0.45"/>
    <rect x="180" y="-14" width="46" height="28" rx="8" fill="url(#jadeTrans)" opacity="0.45"/>

    <path d="M280 0 H392 M368 -20 L392 0 L368 20" fill="none" stroke="#6fe3c0"
          stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

    <g transform="translate(500 0)">
      <path d="M-4 -46 C 40 -46, 62 -14, 40 16 C 24 38, -8 38, -24 16"
            fill="none" stroke="url(#jadeTrans)" stroke-width="12" stroke-linecap="round"/>
      <circle cx="34" cy="-72" r="11" fill="#6fe3c0"/>
      <path d="M6 34 C 6 58, 26 66, 44 58" fill="none" stroke="#6fe3c0"
            stroke-width="9" stroke-linecap="round" opacity="0.7"/>
    </g>
  </g>

  <text x="120" y="446" fill="#eefaf6"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="76" font-weight="800" letter-spacing="-2">How a Balinese Script</text>
  <text x="120" y="530" fill="#eefaf6"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="76" font-weight="800" letter-spacing="-2">Translator Works</text>

  <text x="122" y="610" fill="#6fe3c0"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="42" font-weight="700" letter-spacing="-1">Transliteration, not translation.</text>
</svg>
