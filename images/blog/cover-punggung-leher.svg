<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Sakit Punggung dan Leher Saat Bersepeda">
  <defs>
    <linearGradient id="bgReach" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1116"/>
      <stop offset="1" stop-color="#06080b"/>
    </linearGradient>
    <linearGradient id="steelReach" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3d2e4"/>
      <stop offset="1" stop-color="#5b7089"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bgReach)"/>

  <!-- Torso from horizontal, and the arm reaching out to the bar. The dashed
       line is the horizon the angle is measured against. -->
  <g transform="translate(160 300)">
    <path d="M0 0 H520" stroke="#c3d2e4" stroke-width="5" stroke-dasharray="16 14"
          stroke-linecap="round" opacity="0.3"/>

    <path d="M0 0 L250 -128" fill="none" stroke="url(#steelReach)" stroke-width="15" stroke-linecap="round"/>
    <path d="M0 0 m 96 -8 a 96 96 0 0 0 -8 -41" fill="none" stroke="#c3d2e4"
          stroke-width="6" stroke-linecap="round" opacity="0.7"/>

    <path d="M250 -128 L392 -34" fill="none" stroke="url(#steelReach)" stroke-width="13" stroke-linecap="round" opacity="0.85"/>
    <circle cx="250" cy="-128" r="14" fill="#0e1116" stroke="#c3d2e4" stroke-width="8"/>
    <circle cx="392" cy="-34" r="11" fill="#c3d2e4" opacity="0.65"/>

    <path d="M392 -34 c 26 -14, 52 -10, 66 8" fill="none" stroke="#c3d2e4"
          stroke-width="9" stroke-linecap="round" opacity="0.5"/>
  </g>

  <text x="120" y="500" fill="#eef3f9"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="76" font-weight="800" letter-spacing="-2">Sakit Punggung</text>
  <text x="120" y="584" fill="#eef3f9"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="76" font-weight="800" letter-spacing="-2">dan Leher</text>

  <text x="122" y="664" fill="#c3d2e4"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="42" font-weight="700" letter-spacing="-1">Biasanya soal jangkauan ke setang.</text>
</svg>
